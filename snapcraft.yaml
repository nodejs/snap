name: node
version: '27.0.0-nightly20261002a7a97841'
summary: Node.js
description: |
  A JavaScript runtime built on Chrome's V8 JavaScript engine. Node.js uses an event-driven, non-blocking I/O model that makes it lightweight and efficient. Node.js' package ecosystem, npm, is the largest ecosystem of open source libraries in the world. https://nodejs.org/

grade: stable
confinement: classic
base: core24

environment:
  PATH: '$SNAP/bin:$PATH'
  LD_LIBRARY_PATH: '$SNAP/lib/runtime'

apps:
  node:
    command: bin/node
  npm:
    command: bin/npm
  npx:
    command: bin/npx

parts:
  node-prebuilt:
    plugin: nil
    build-attributes:
      - no-patchelf
    build-packages:
      - curl
      - xz-utils
    override-pull: |
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          archive="node-v27.0.0-nightly20261002a7a978415c-linux-x64.tar.xz"
          checksum="dcc2d574d387c82a69d4441476d0cd73174f946fa99281ac5572d24f46e4395c"
          ;;
        arm64)
          archive="node-v27.0.0-nightly20261002a7a978415c-linux-arm64.tar.xz"
          checksum="1f460b9370b354c4c935261086e773c4c9af7bcecfd85dce81566913aaf54f3b"
          ;;
        s390x)
          archive="node-v27.0.0-nightly20261002a7a978415c-linux-s390x.tar.xz"
          checksum="9fa74b2399f5e84ba47d48efa02545abff5a9b785ef1b77c6e2d0f0812e4ac10"
          ;;
        armhf)
          if [ "source" != "prebuilt" ]; then
            exit 0
          fi
          archive=""
          checksum=""
          ;;
        *)
          echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR" >&2
          exit 1
          ;;
      esac
      cd "$CRAFT_PART_SRC"
      curl -sSL --show-error --fail --proto '=https' --tlsv1.2         --output "$archive" "https://nodejs.org/download/nightly/v27.0.0-nightly20261002a7a978415c/$archive"
      echo "$checksum  $archive" | sha256sum --check --strict -
      tar -xJf "$archive" --strip-components=1
      rm "$archive"
    override-build: |
      if [ "$CRAFT_ARCH_BUILD_FOR" = "armhf" ] && [ "source" != "prebuilt" ]; then
        exit 0
      fi
      craftctl default
      cp -a "$CRAFT_PART_SRC"/. "$CRAFT_PART_INSTALL"/
      mkdir -p "$CRAFT_PART_INSTALL/etc"
      echo "prefix = /usr/local" >> "$CRAFT_PART_INSTALL/etc/npmrc"

  node-libatomic:
    plugin: nil
    build-attributes:
      - no-patchelf
    build-packages:
      - libatomic1
    override-build: |
      craftctl default
      install -Dm644         "/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libatomic.so.1"         "$CRAFT_PART_INSTALL/lib/runtime/libatomic.so.1"

  node-experimental:
    plugin: make
    source: .
    build-attributes:
      - enable-patchelf
    build-snaps:
      - to armhf:
          - rustup/latest/stable
    build-packages:
      - curl
      - xz-utils
      - to armhf:
          - gcc-14
          - g++-14
    stage-packages:
      - to armhf:
          - libstdc++6
          - libgcc-s1
    build-environment:
      - CC: gcc-14
      - CXX: g++-14
      - LINK: g++-14
      - RUSTUP_TOOLCHAIN: "1.83.0"
      - V: ""
    make-parameters:
      - V=
    override-pull: |
      if [ "source" != "source" ] || [ "$CRAFT_ARCH_BUILD_FOR" != "armhf" ]; then
        exit 0
      fi
      cd "$CRAFT_PART_SRC"
      archive="node-v27.0.0-nightly20261002a7a978415c.tar.xz"
      curl -sSL --show-error --fail --proto '=https' --tlsv1.2         --output "$archive" "https://nodejs.org/download/nightly/v27.0.0-nightly20261002a7a978415c/$archive"
      echo "397b21630e532fe8ba087bd66cd13ec73e6c63c9fc5a0f2f6279d6ab12297aca  $archive" | sha256sum --check --strict -
      tar -xJf "$archive" --strip-components=1
      rm "$archive"
    override-build: |
      if [ "source" != "source" ] || [ "$CRAFT_ARCH_BUILD_FOR" != "armhf" ]; then
        exit 0
      fi
      rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      ./configure --verbose --prefix=/ --release-urlbase=https://nodejs.org/download/nightly/ --tag=nightly20261002a7a978415c --v8-enable-temporal-support
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/etc"
      echo "prefix = /usr/local" >> "$CRAFT_PART_INSTALL/etc/npmrc"
