name: node
version: '27.0.0-nightly20260928b59840b5'
summary: Node.js
description: |
  A JavaScript runtime built on Chrome's V8 JavaScript engine. Node.js uses an event-driven, non-blocking I/O model that makes it lightweight and efficient. Node.js' package ecosystem, npm, is the largest ecosystem of open source libraries in the world. https://nodejs.org/

grade: stable
confinement: classic
base: core24

environment:
  PATH: '$SNAP/bin:$PATH'
  LD_LIBRARY_PATH: '$SNAP/lib/runtime'

apps:
  node:
    command: bin/node
  npm:
    command: bin/npm
  npx:
    command: bin/npx

parts:
  node-prebuilt:
    plugin: nil
    build-attributes:
      - no-patchelf
    build-packages:
      - curl
      - xz-utils
    override-pull: |
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          archive="node-v27.0.0-nightly20260928b59840b593-linux-x64.tar.xz"
          checksum="c706046fdd0e64e71e3960d78c33b91fc29eeef56fca00f30a085ed7287813fa"
          ;;
        arm64)
          archive="node-v27.0.0-nightly20260928b59840b593-linux-arm64.tar.xz"
          checksum="0a4e6138dffafded9d9d93d4b81b26ea6ab3da6637123aaf63780b5aa3acd89f"
          ;;
        s390x)
          archive="node-v27.0.0-nightly20260928b59840b593-linux-s390x.tar.xz"
          checksum="69fe37b151d376717225bdaccb38e0ff4cb7f3118e11e2ca8bbcd5812880060f"
          ;;
        armhf)
          if [ "source" != "prebuilt" ]; then
            exit 0
          fi
          archive=""
          checksum=""
          ;;
        *)
          echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR" >&2
          exit 1
          ;;
      esac
      cd "$CRAFT_PART_SRC"
      curl -sSL --show-error --fail --proto '=https' --tlsv1.2         --output "$archive" "https://nodejs.org/download/nightly/v27.0.0-nightly20260928b59840b593/$archive"
      echo "$checksum  $archive" | sha256sum --check --strict -
      tar -xJf "$archive" --strip-components=1
      rm "$archive"
    override-build: |
      if [ "$CRAFT_ARCH_BUILD_FOR" = "armhf" ] && [ "source" != "prebuilt" ]; then
        exit 0
      fi
      craftctl default
      cp -a "$CRAFT_PART_SRC"/. "$CRAFT_PART_INSTALL"/
      mkdir -p "$CRAFT_PART_INSTALL/etc"
      echo "prefix = /usr/local" >> "$CRAFT_PART_INSTALL/etc/npmrc"

  node-libatomic:
    plugin: nil
    build-attributes:
      - no-patchelf
    build-packages:
      - libatomic1
    override-build: |
      craftctl default
      install -Dm644         "/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libatomic.so.1"         "$CRAFT_PART_INSTALL/lib/runtime/libatomic.so.1"

  node-experimental:
    plugin: make
    source: .
    build-attributes:
      - enable-patchelf
    build-snaps:
      - to armhf:
          - rustup/latest/stable
    build-packages:
      - curl
      - xz-utils
      - to armhf:
          - gcc-14
          - g++-14
    stage-packages:
      - to armhf:
          - libstdc++6
          - libgcc-s1
    build-environment:
      - CC: gcc-14
      - CXX: g++-14
      - LINK: g++-14
      - RUSTUP_TOOLCHAIN: "1.83.0"
      - V: ""
    make-parameters:
      - V=
    override-pull: |
      if [ "source" != "source" ] || [ "$CRAFT_ARCH_BUILD_FOR" != "armhf" ]; then
        exit 0
      fi
      cd "$CRAFT_PART_SRC"
      archive="node-v27.0.0-nightly20260928b59840b593.tar.xz"
      curl -sSL --show-error --fail --proto '=https' --tlsv1.2         --output "$archive" "https://nodejs.org/download/nightly/v27.0.0-nightly20260928b59840b593/$archive"
      echo "313b34aa12bf5c3e620e38bc27a69162fb8f36823c026783855615d8429ed1b8  $archive" | sha256sum --check --strict -
      tar -xJf "$archive" --strip-components=1
      rm "$archive"
    override-build: |
      if [ "source" != "source" ] || [ "$CRAFT_ARCH_BUILD_FOR" != "armhf" ]; then
        exit 0
      fi
      rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      ./configure --verbose --prefix=/ --release-urlbase=https://nodejs.org/download/nightly/ --tag=nightly20260928b59840b593 --v8-enable-temporal-support
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/etc"
      echo "prefix = /usr/local" >> "$CRAFT_PART_INSTALL/etc/npmrc"
